        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: Admin products list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Product' }
                  page: { type: integer, example: 1 }
                  limit: { type: integer, example: 20 }
                  total: { type: integer, example: 1 }
                  pages: { type: integer, example: 1 }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [admin-products]
      summary: Create product with variants
      description: Creates a new product with at least one variant.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, description, categoryId, variants]
              properties:
                name: { type: string, example: "Classic Crewneck T-Shirt" }
                slug: { type: string, example: "classic-crewneck-tshirt" }
                description: { type: string, example: "Premium organic cotton t-shirt built for daily comfort." }
                categoryId: { type: string, example: "65b9e0f11a4362b8cf1034c1" }
                imageUrl: { type: string, format: uri, example: "https://images.unsplash.com/photo-1521572267360-ee0c2909d518?w=500" }
                isActive: { type: boolean, default: true, example: true }
                variants:
                  type: array
                  minItems: 1
                  items:
                    type: object
                    required: [sku, priceMinor]
                    properties:
                      sku: { type: string, example: "TS-BLK-S" }
                      attributes: { type: object, additionalProperties: { type: string }, example: { size: "S", color: "Black" } }
                      priceMinor: { type: integer, minimum: 0, example: 49900 }
                      stock: { type: integer, minimum: 0, default: 0, example: 15 }
                      isActive: { type: boolean, default: true, example: true }
      responses:
        '201':
          description: Product created
          content:
            application/json:
              schema:
                type: object
                properties:
                  product: { $ref: '#/components/schemas/Product' }
                  variants: { type: array, items: { $ref: '#/components/schemas/Variant' } }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }

