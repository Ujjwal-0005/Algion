                        - type: object
                          properties:
                            orderCount: { type: integer, example: 3 }
                  page: { type: integer, example: 1 }
                  limit: { type: integer, example: 20 }
                  total: { type: integer, example: 2 }
                  pages: { type: integer, example: 1 }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /admin/customers/{id}:
    get:
      tags: [admin-customers]
      summary: Get customer details
      description: Returns customer profile and their order history.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: 65b9e0f11a4362b8cf1034a1
      responses:
        '200':
          description: Customer details with orders
          content:
            application/json:
              schema:
                type: object
                properties:
                  customer: { $ref: '#/components/schemas/User' }
                  orders:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /admin/coupons:
    get:
      tags: [admin-coupons]
      summary: List coupons
      description: Returns all promotional coupons including inactive ones.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Coupons list
          content:
            application/json:
              schema:
                type: object
                properties:
                  coupons:
                    type: array
                    items: { $ref: '#/components/schemas/Coupon' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
    post:
      tags: [admin-coupons]
      summary: Create coupon
      description: Creates a promotional coupon with percentage or fixed discount.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code, type, value, expiresAt]
              properties:
                code: { type: string, example: "FESTIVE25" }
                type: { type: string, enum: [percent, fixed], example: "percent" }
                value: { type: integer, example: 25 }
                minSubtotalMinor: { type: integer, default: 0, example: 100000 }
                expiresAt: { type: string, format: date-time, example: "2027-12-31T23:59:59.000Z" }
                isActive: { type: boolean, default: true, example: true }
      responses:
        '201':
          description: Coupon created
          content:
            application/json:
              schema:
                type: object
                properties:
                  coupon: { $ref: '#/components/schemas/Coupon' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '409': { $ref: '#/components/responses/ConflictError' }

  /admin/coupons/{id}:
    delete:
      tags: [admin-coupons]
      summary: Deactivate coupon
      description: Deactivates an active promotional coupon.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: 65b9e0f11a4362b8cf1034f1
      responses:
        '200':
          description: Coupon deactivated
          content:
            application/json:
              schema:
                type: object
                properties:
                  coupon: { $ref: '#/components/schemas/Coupon' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /admin/audit-logs:
    get:
      tags: [admin-audit]
      summary: View audit logs
      description: Returns immutable audit records filtered by entityType, actorId, and date range.
      security:
        - cookieAuth: []
      parameters:
        - name: entityType
          in: query
          schema: { type: string, enum: [Order, Product, Variant, Category, Coupon, User] }
          example: Order
        - name: actorId
          in: query
          schema: { type: string }
          example: 65b9e0f11a4362b8cf1034a1
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: Audit logs list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/AuditLog' }
                  page: { type: integer, example: 1 }
                  limit: { type: integer, example: 20 }
                  total: { type: integer, example: 1 }
                  pages: { type: integer, example: 1 }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /admin/reports/summary:
    get:
      tags: [admin-reports]
      summary: Summary sales report
      description: Returns sales metrics, gross revenue, order status counts, and daily revenue series computed dynamically over orders.
      security:
        - cookieAuth: []
      parameters:
        - name: from
          in: query
          schema: { type: string, format: date-time }
        - name: to
          in: query
          schema: { type: string, format: date-time }
      responses:
        '200':
          description: Summary report
          content:
            application/json:
              schema:
                type: object
                properties:
                  summary:
                    type: object
                    properties:
                      totalOrders: { type: integer, example: 10 }
                      grossRevenueMinor: { type: integer, example: 4500000 }
                      averageOrderValueMinor: { type: integer, example: 450000 }
                      cancelledCount: { type: integer, example: 1 }
                      paymentFailedCount: { type: integer, example: 1 }
                      orderCountsByStatus:
                        type: object
                        additionalProperties: { type: integer }
                      dailyRevenueSeries:
                        type: array
                        items:
                          type: object
                          properties:
                            date: { type: string, example: "2026-11-11" }
                            revenueMinor: { type: integer, example: 4500000 }
                            orderCount: { type: integer, example: 10 }
                      lowStockVariants:
                        type: array
                        items: { $ref: '#/components/schemas/Variant' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }

  /admin/reports/reconciliation:
    get:
      tags: [admin-reports]
      summary: Invariant reconciliation report
      description: Validates database invariants (daily revenue sum, order count sum, variant inventory balance) and returns pass/fail status.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Reconciliation report
          content:
            application/json:
              schema:
                type: object
                properties:
                  allPassed: { type: boolean, example: true }
                  checks:
                    type: object
                    properties:
                      dailySeriesMatchesGrossRevenue:
                        type: object
                        properties:
                          pass: { type: boolean, example: true }
                      statusCountsSumMatchesTotalOrders:
                        type: object
                        properties:
                          pass: { type: boolean, example: true }
                      variantInventoryIntegrity:
                        type: object
                        properties:
                          pass: { type: boolean, example: true }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '403': { $ref: '#/components/responses/ForbiddenError' }
