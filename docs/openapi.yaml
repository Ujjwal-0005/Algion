      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [variantId, quantity]
              properties:
                variantId: { type: string, example: "65b9e0f11a4362b8cf1034d1" }
                quantity: { type: integer, minimum: 1, maximum: 10, example: 1 }
      responses:
        '200':
          description: Item added to cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/InsufficientStockError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /cart/items/{variantId}:
    patch:
      tags: [cart]
      summary: Update cart item quantity
      description: Updates the quantity of a specific variant in the customer's cart.
      security:
        - cookieAuth: []
      parameters:
        - name: variantId
          in: path
          required: true
          schema: { type: string }
          example: 65b9e0f11a4362b8cf1034d1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [quantity]
              properties:
                quantity: { type: integer, minimum: 1, maximum: 10, example: 2 }
      responses:
        '200':
          description: Cart quantity updated
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/InsufficientStockError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [cart]
      summary: Remove cart item
      description: Deletes a variant line from the customer's cart.
      security:
        - cookieAuth: []
      parameters:
        - name: variantId
          in: path
          required: true
          schema: { type: string }
          example: 65b9e0f11a4362b8cf1034d1
      responses:
        '200':
          description: Item removed from cart
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }

  /cart/coupon:
    post:
      tags: [cart]
      summary: Apply coupon code
      description: Applies an active coupon to calculate discounts against the cart subtotal.
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string, example: "WELCOME10" }
      responses:
        '200':
          description: Coupon applied
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart: { $ref: '#/components/schemas/Cart' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
    delete:
      tags: [cart]
      summary: Remove coupon code
      description: Clears any active coupon applied to the cart.
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Coupon removed
          content:
            application/json:
              schema:
                type: object
                properties:
                  cart: { $ref: '#/components/schemas/Cart' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }

  /checkout:
    post:
      tags: [checkout]
      summary: Checkout cart
      description: Decrements inventory atomically within a MongoDB transaction and creates an order in PLACED state.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [addressId]
              properties:
                addressId: { type: string, example: "65b9e0f11a4362b8cf1034ab" }
      responses:
        '201':
          description: Order created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '200':
          description: Idempotent return of existing order
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/InsufficientStockError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '409': { $ref: '#/components/responses/DuplicateRequestError' }

  /orders:
    get:
      tags: [orders]
      summary: List customer orders
      description: Returns orders placed by the currently authenticated customer.
      security:
        - cookieAuth: []
      parameters:
        - $ref: '#/components/parameters/PageQueryParam'
        - $ref: '#/components/parameters/LimitQueryParam'
      responses:
        '200':
          description: Customer orders list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items: { $ref: '#/components/schemas/Order' }
                  page: { type: integer, example: 1 }
                  limit: { type: integer, example: 10 }
                  total: { type: integer, example: 1 }
                  pages: { type: integer, example: 1 }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }

  /orders/{id}:
    get:
      tags: [orders]
      summary: Get customer order detail
      description: Retrieves details of an order belonging to the customer. Returns 404 if order belongs to another customer.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: 65b9e0f11a4362b8cf103501
      responses:
        '200':
          description: Order details
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }

  /orders/{id}/pay:
    post:
      tags: [orders]
      summary: Simulate order payment
      description: Simulates payment outcome. Success moves order to PAID. Decline moves order to PAYMENT_FAILED and restores stock.
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: string }
          example: 65b9e0f11a4362b8cf103501
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [outcome]
              properties:
                method: { type: string, default: "simulated", example: "simulated" }
                outcome: { type: string, enum: [success, decline], example: "success" }
      responses:
        '200':
          description: Payment processed
          content:
            application/json:
              schema:
                type: object
                properties:
                  order: { $ref: '#/components/schemas/Order' }
        '400': { $ref: '#/components/responses/ValidationError' }
        '401': { $ref: '#/components/responses/UnauthenticatedError' }
        '404': { $ref: '#/components/responses/NotFoundError' }
        '409': { $ref: '#/components/responses/InvalidTransitionError' }

  /orders/{id}/cancel:
    post:
